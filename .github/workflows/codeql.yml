name: "CodeQL"

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "55 10 * * 0"

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: [go, python]

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4.38.3
              with:
                  languages: ${{ matrix.language }}
                  queries: +security-and-quality

            - name: Autobuild
              uses: github/codeql-action/autobuild@v4.38.3
              if: ${{ matrix.language == 'go' || matrix.language == 'python' }}

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4.38.3
              with:
                  category: "/language:${{ matrix.language }}"
