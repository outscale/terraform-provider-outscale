name: Check build & lint

on:
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.*"
      - "GNUMakefile"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⬇️ Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "./go.mod"
      - name: 🔎 golangci-lint
        uses: outscale/goutils/.github/actions/lint@1bb3410dfa22c53e69de29f57671e668c4627690 # v1.0.4
      - name: 🔎 Run make build
        run: make build
        shell: bash
