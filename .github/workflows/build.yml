name: Check build & lint

on:
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.*"
      - "GNUMakefile"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7.0.1
      - name: ⬇️ Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "./go.mod"
      - name: 🔎 golangci-lint
        uses: outscale/goutils/.github/actions/lint@v1.0.4
      - name: 🔎 Run make build
        run: make build
        shell: bash
