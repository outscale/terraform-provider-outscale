# This GitHub action can generate binaries for the PR and upload them for future use
name: Generate binaries on PR
on:
    pull_request:
        branches:
            - main
        paths:
            - ".github/workflows/generate_binaries_on_pr.yml"
            - "**.go"
            - "**.sum"
            - "**.mod"
            - "GNUmakefile"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    goreleaser:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
            - name: Set up Go
              uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: "./go.mod"
            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v7.2.2
              with:
                  version: latest
                  args: build --clean --snapshot
            - name: Upload assets
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: terraform-provider-outscale
                  path: dist/terraform-provider-outscale*
