name: Reusable Integration Test

on:
    workflow_call:
        inputs:
            test-command:
                required: true
                type: string
            region:
                required: true
                type: string
            service:
                required: true
                type: string
            providers:
                required: true
                type: string
            account:
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    integration-test:
        environment: test-${{ inputs.region }}
        runs-on:
            - authenticated
            - ${{ inputs.region }}
            - ${{ inputs.service }}
        steps:
            - name: 🔒🧹 Setup Vault & Frieza
              id: secrets
              uses: outscale/.github/vault-frieza-clean@v1.3.0
              with:
                vault_role: outscale-terraform-provider-outscale
                osc_account: ${{ inputs.account }}
                providers: ${{ inputs.providers }}
                exclude_resource_types: access_key
                bypass_deletion_protection: true
            - uses: actions/checkout@v7.0.1
            - name: Set up Go
              uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: "./go.mod"
            - name: Set up Python
              uses: actions/setup-python@v7.0.0
              with:
                  python-version: "3.14"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r tests/requirements.txt
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.0
              with:
                  terraform_version: 1.14.3
                  terraform_wrapper: false
            - name: Run integration tests
              run: make ${{ inputs.test-command }}
              env:
                  TF_VAR_image_id: ${{ vars.OUTSCALE_IMAGEID }}
                  TF_VAR_account_id: ${{ steps.secrets.outputs.account_id }}
                  TF_VAR_region: ${{ steps.secrets.outputs.region }}
