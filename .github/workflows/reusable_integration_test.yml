name: Reusable Integration Test

on:
    workflow_call:
        inputs:
            test-command:
                required: true
                type: string
            region:
                required: true
                type: string
            service:
                required: true
                type: string
            providers:
                required: true
                type: string
            account:
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    integration-test:
        environment: test-${{ inputs.region }}
        runs-on:
            - authenticated
            - ${{ inputs.region }}
            - ${{ inputs.service }}
        steps:
            - name: 🔒🧹 Setup Vault & Frieza
              id: secrets
              uses: outscale/.github/vault-frieza-clean@a49bd74a4b54c0550bd19d4dc939be09ae951148
              with:
                vault_role: outscale-terraform-provider-outscale
                osc_account: ${{ inputs.account }}
                providers: ${{ inputs.providers }}
                exclude_resource_types: access_key
                bypass_deletion_protection: true
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: "./go.mod"
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.14"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r tests/requirements.txt
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
              with:
                  terraform_version: 1.14.3
                  terraform_wrapper: false
            - name: Run integration tests
              run: make ${{ inputs.test-command }}
              env:
                  TF_VAR_image_id: ${{ secrets.OUTSCALE_IMAGEID }}
                  TF_VAR_account_id: ${{ secrets.OSC_ACCOUNT_ID }}
                  TF_VAR_region: ${{ steps.secrets.outputs.region }}
