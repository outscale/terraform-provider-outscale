name: PR Auto Tagging

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tag_pr:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: 🔖 Tag PR
      uses: outscale/.github/auto-tagging@cc76c3e03f3c7a83a09914b1ed65b7fea5605fb8 # v1.5.1
