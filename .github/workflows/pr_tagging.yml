name: PR Auto Tagging

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tag_pr:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: 🔖 Tag PR
      uses: outscale/.github/auto-tagging@2806dfed40e08ccd51bee7edcac524fd02a67f06 # v1.3.0
