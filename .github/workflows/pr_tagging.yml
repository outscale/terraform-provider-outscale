name: PR Auto Tagging

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tag_pr:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: 🔖 Tag PR
      uses: outscale/.github/auto-tagging@v1.1.2
