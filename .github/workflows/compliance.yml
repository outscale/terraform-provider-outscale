name: Compliance

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Plumber
      uses: outscale/.github/pipeline-compliance@v1.1.2
      with:
        plumber-threshold: 93
        github-token: ${{ secrets.PLUMBER_TOKEN }}
