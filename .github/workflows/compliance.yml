name: Compliance

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Plumber
      uses: outscale/.github/pipeline-compliance@95a82755abf72a78ac11b119da11d042e0152328 # v1.2.0
      with:
        plumber-threshold: 93
        github-token: ${{ secrets.PLUMBER_TOKEN }}
