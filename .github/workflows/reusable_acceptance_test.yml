name: Reusable Acceptance Test

on:
    workflow_call:
        inputs:
            test-command:
                required: true
                type: string
            region:
                required: true
                type: string
            service:
                required: true
                type: string
            providers:
                required: true
                type: string
            account:
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    acceptance-test:
        environment: test-${{ inputs.region }}
        runs-on:
            - authenticated
            - ${{ inputs.region }}
            - ${{ inputs.service }}
        steps:
            - name: 🔒🧹 Setup Vault & Frieza
              id: secrets
              uses: outscale/.github/vault-frieza-clean@a49bd74a4b54c0550bd19d4dc939be09ae951148
              with:
                vault_role: outscale-terraform-provider-outscale
                osc_account: ${{ inputs.account }}
                providers: ${{ inputs.providers }}
                bypass_deletion_protection: true
                exclude_resource_types: access_key
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: "./go.mod"
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
              with:
                  terraform_version: 1.14.3
                  terraform_wrapper: false
            - name: Build go test
              run: make test
              env:
                  OUTSCALE_ACCOUNT: ${{ secrets.OSC_ACCOUNT_ID }}
                  OUTSCALE_IMAGEID: ${{ secrets.OUTSCALE_IMAGEID }}
            - name: Run acceptance tests
              run: make ${{ inputs.test-command }}
              env:
                  OUTSCALE_ACCOUNT: ${{ secrets.OSC_ACCOUNT_ID }}
                  OUTSCALE_IMAGEID: ${{ secrets.OUTSCALE_IMAGEID }}
