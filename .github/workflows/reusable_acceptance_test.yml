name: Reusable Acceptance Test

on:
    workflow_call:
        inputs:
            test-command:
                required: true
                type: string
            region:
                required: true
                type: string
            service:
                required: true
                type: string
            providers:
                required: true
                type: string
            account:
                required: true
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    acceptance-test:
        environment: test-${{ inputs.region }}
        runs-on:
            - authenticated
            - ${{ inputs.region }}
            - ${{ inputs.service }}
        steps:
            - name: 🔒🧹 Setup Vault & Frieza
              id: secrets
              uses: outscale/.github/vault-frieza-clean@v1.3.0
              with:
                vault_role: outscale-terraform-provider-outscale
                osc_account: ${{ inputs.account }}
                providers: ${{ inputs.providers }}
                bypass_deletion_protection: true
                exclude_resource_types: access_key
            - uses: actions/checkout@v7.0.1
            - name: Set up Go
              uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: "./go.mod"
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4.0.0
              with:
                  terraform_version: 1.14.3
                  terraform_wrapper: false
            - name: Build go test
              run: make test
              env:
                  OUTSCALE_ACCOUNT: ${{ steps.secrets.outputs.account_id }}
                  OUTSCALE_IMAGEID: ${{ vars.OUTSCALE_IMAGEID }}
            - name: Run acceptance tests
              run: make ${{ inputs.test-command }}
              env:
                  OUTSCALE_ACCOUNT: ${{ steps.secrets.outputs.account_id }}
                  OUTSCALE_IMAGEID: ${{ vars.OUTSCALE_IMAGEID }}
