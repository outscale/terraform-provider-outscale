name: Examples tofu tests

on:
    pull_request:
        branches:
            - main
        paths:
            - "examples/**.tfvars"
            - "examples/**.tf"
            - "scripts/test-examples.sh"
            - "GNUmakefile"
            - ".github/workflows/tofu_examples.yml"
    schedule:
        - cron: "30 22 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    examples-tofu-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: "./go.mod"
            - name: Setup OpenTofu
              uses: opentofu/setup-opentofu@v2.0.2
              with:
                  tofu_wrapper: false
            - name: Run Examples
              run: make tofu-examples
